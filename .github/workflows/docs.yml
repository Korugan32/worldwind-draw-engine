name: Docs

# Builds the API documentation (Dokka) and publishes it on GitHub Pages when master changes.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions". The repository has to be public
# (GitHub Pages is not available for a private repository on a free account).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the API documentation
        run: ./gradlew dokkaGenerate -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html
      - id: deployment
        uses: actions/deploy-pages@v4
