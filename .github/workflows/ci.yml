name: CI

on:
  push:
    branches: [master]
  pull_request:

# One run per branch: a newer push cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS: the iOS targets need Xcode's tools. `build` runs the tests of every target, the lint and the API check (checkKotlinAbi).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --continue
      - name: Build the API documentation
        run: ./gradlew dokkaGenerate
      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
